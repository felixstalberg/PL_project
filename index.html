<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PL Statistics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Statistik Premier League säsongen 2026/2027</h1>

    <label for="stat-select">Statistik</label>

    <select id="stat-select">
        <option value="top_scorers">Skytteliga</option>
        <option value="top_assists">Assistliga</option>
        <option value="top_goal_involvements">Poängliga</option>
        <option value="top_fpl_points">FPL-poängliga</option>
    </select>

    <div class="table-header">
        <span>#</span>
        <span>Spelare</span>
        <span id="stat-name">Mål</span>
    </div>

    <div id="player-list"></div>

    <script src="script.js"></script>

</body>

</html>
