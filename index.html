<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PL Stats</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Statistik Premier League säsongen 2026/2027</h1>

    <div class="stats-container">

        <section class="stat-box">
            <h2>Skytteliga</h2>
            <div id="top-scorers"></div>
        </section>

        <section class="stat-box">
            <h2>Assistliga</h2>
            <div id="top-assists"></div>
        </section>

        <section class="stat-box">
            <h2>Poängliga</h2>
            <div id="goal-involvements"></div>
        </section>

        <section class="stat-box">
            <h2>FPL-poängliga</h2>
            <div id="fpl-points"></div>
        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
