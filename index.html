<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PL Statistics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="home-page">

    <img src="images/pl-logo.png" alt="Premier League logotyp" class="pl-logo">

    <h2>Information om säsongen 2026/2027</h1>

    <button class="menu-button" id="table-button">Tabell</button>

    <button class="menu-button" id="stats-button">Statistik</button>

    <button class="menu-button" id="matches-button">Matcher</button>

</div>

<div id="table-page">

    <h1>Tabell</h1>

    <div id="table-list"></div>

</div>

<div id="stats-page">

    <h1>Statistik</h1>

    <select id="stat-select">
        <option value="top_scorers">Skytteliga</option>
        <option value="top_assists">Assistliga</option>
        <option value="top_goal_involvements">Poängliga</option>
        <option value="top_fpl_points">FPL-poängliga</option>
    </select>

    <div class="table-header">
        <span>#</span>
        <span>Spelare</span>
        <span id="stat-name">Mål</span>
    </div>

    <div id="player-list"></div>

</div>

<div id="stats-page">

    <h1>Matcher</h1>

</div>


<script src="script.js"></script>

</body>

</html>
